<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      if (new URLSearchParams(location.search).has("rtl")) {
        document.documentElement.dir = "rtl";
      }
    </script>
    <link rel="stylesheet" href="../../xExtension-CompactMediaCards/static/compact-media-cards.css" />
    <link rel="stylesheet" href="../static/oled-black.css" />
    <style>
      body { margin: 0; }
      .header { min-height: 40px; }
      #global {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 600px;
      }
      .aside_feed { min-height: 600px; }
      #stream { min-height: 600px; }
      .fixture-panel { min-height: 80px; }
      #subscription-title::after {
        content: attr(data-unread);
        display: inline-block;
        margin-left: 8px;
        padding: 1px 7px;
      }
      @media (max-width: 840px) {
        #global { display: block; }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="item title"><a href="#">FreshRSS</a></div>
      <div class="item search">
        <form>
          <div id="header-search" class="stick">
            <input id="header-search-input" type="search" value="Search" />
            <button id="header-search-button" class="btn" type="submit">
              <img id="header-search-icon" class="icon" alt="" src="icon.png" />
            </button>
          </div>
        </form>
      </div>
      <nav class="item configure">
        <div class="dropdown">
          <div id="dropdown-configure" class="dropdown-target"></div>
          <a id="global-settings" class="btn dropdown-toggle" href="#dropdown-configure">
            <img id="global-settings-icon" class="icon" alt="" src="icon.png" />
          </a>
        </div>
      </nav>
    </header>
    <div id="global">
      <nav id="aside_feed" class="aside aside_feed">
        <ul id="sidebar" class="tree">
          <li class="tree-folder category all">
            <a class="tree-folder-title" href="#">
              <span id="subscription-title" class="title" data-unread="2310">Subscriptions</span>
            </a>
          </li>
          <li class="tree-folder category">
            <a class="tree-folder-title" href="#"><span class="title" data-unread="527">Entertainment</span></a>
          </li>
        </ul>
      </nav>
      <main id="stream">
        <div id="cmc_toolbar">
          <div id="cmc_toolbar_main">
            <div id="cmc_toolbar_title">Subscriptions</div>
          </div>
        </div>
        <nav class="nav_menu">
          <button id="configure-view" class="btn" type="button">Configure view</button>
          <div id="nav_menu_actions" class="group">
            <a id="filter-default" class="btn" href="#"><img id="read-icon" class="icon" alt="" src="icon.png" /></a>
            <a id="filter-active" class="btn active" href="#"><img class="icon" alt="" src="icon.png" /></a>
            <a class="btn" href="#"><img class="icon" alt="" src="icon.png" /></a>
            <a class="btn" href="#"><img class="icon" alt="" src="icon.png" /></a>
            <div id="nav_menu_queries" class="dropdown">
              <a id="toggle-userqueries" class="dropdown-toggle btn" href="#">
                <img id="userqueries-icon" class="icon" alt="" src="icon.png" />
              </a>
            </div>
          </div>
          <div class="nav_menu_read_all group stick">
            <form class="mark-read-menu">
              <button class="read_all btn" type="button">Mark as read</button>
              <div id="nav_menu_read" class="dropdown">
                <div id="dropdown-read" class="dropdown-target"></div>
                <a class="dropdown-toggle btn" href="#dropdown-read">
                  <img id="mark-read-icon" class="icon" alt="" src="icon.png" />
                </a>
                <ul class="dropdown-menu"><li>Mark all as read</li></ul>
              </div>
            </form>
          </div>
          <div id="nav_menu_views" class="group">
            <a class="btn active" href="#"><img class="icon" alt="" src="icon.png" /></a>
            <a class="btn" href="#"><img class="icon" alt="" src="icon.png" /></a>
            <a class="btn" href="#"><img class="icon" alt="" src="icon.png" /></a>
          </div>
          <div id="nav_menu_sort" class="group">
            <div class="dropdown">
              <a id="toggle-order" class="dropdown-toggle btn" href="#">
                <img id="sort-icon" class="icon" alt="" src="icon.png" />
              </a>
            </div>
          </div>
          <div id="nav_menu_actualize" class="group">
            <a id="actualize" class="btn" href="#"><img id="refresh-icon" class="icon" alt="" src="icon.png" /></a>
          </div>
          <div>
            <a id="more-settings" class="btn" href="#">More settings</a>
          </div>
        </nav>
        <div id="dropdown-search-wrapper" class="dropdown only-mobile">
          <div id="dropdown-search" class="dropdown-target"></div>
          <a id="toggle-search" class="dropdown-toggle btn" title="Search" href="#dropdown-search">
            <img id="mobile-search-icon" class="icon" alt="" src="icon.png" />
          </a>
          <ul class="dropdown-menu"><li class="item"><input type="search" value="Search" /></li></ul>
        </div>
        <div id="card" class="flux cmc-swipe-ready cmc-no-thumbnail not_read">
          <ul id="card-header" class="flux_header">
            <li id="thumbnail" class="item thumbnail"></li>
            <li class="item titleAuthorSummaryDate">
              <a class="title">OLED card</a><span class="date">Now</span>
            </li>
            <li id="text-card" class="cmc-text-content">
              <a class="title">Text card</a><span class="summary">Summary</span>
            </li>
          </ul>
        </div>
        <section id="panel" class="fixture-panel"></section>
        <section id="settings-box" class="box">
          <div class="box-title">Settings</div>
          <div class="box-content">
            <input id="settings-input" value="Value" />
          </div>
        </section>
      </main>
    </div>
    <script>
      addEventListener("load", () => {
        const color = (id, pseudo = null) =>
          getComputedStyle(document.querySelector(id), pseudo).backgroundColor;
        const image = (id, pseudo = null) =>
          getComputedStyle(document.querySelector(id), pseudo).backgroundImage;
        const rect = (id) => {
          const box = document.querySelector(id).getBoundingClientRect();
          return { top: box.top, right: box.right, bottom: box.bottom, left: box.left, width: box.width, height: box.height };
        };
        const control = (id, pseudo = null) => {
          const style = getComputedStyle(document.querySelector(id), pseudo);
          return {
            backgroundColor: style.backgroundColor,
            backgroundImage: style.backgroundImage,
            borderColor: style.borderColor,
            borderRadius: style.borderRadius,
            borderTopWidth: style.borderTopWidth,
            borderRightWidth: style.borderRightWidth,
            borderBottomWidth: style.borderBottomWidth,
            borderLeftWidth: style.borderLeftWidth,
            color: style.color,
            boxShadow: style.boxShadow,
            gap: style.gap,
            paddingTop: style.paddingTop,
            paddingRight: style.paddingRight,
            paddingBottom: style.paddingBottom,
            paddingLeft: style.paddingLeft,
            lineHeight: style.lineHeight,
            content: style.content,
          };
        };
        const icon = (id) => {
          const element = document.querySelector(id);
          const style = getComputedStyle(element);
          const box = element.getBoundingClientRect();
          return {
            display: style.display,
            visibility: style.visibility,
            opacity: style.opacity,
            filter: style.filter,
            width: box.width,
            height: box.height,
            naturalWidth: element.naturalWidth,
            naturalHeight: element.naturalHeight,
            objectPosition: style.objectPosition,
            clipPath: style.clipPath,
          };
        };
        const values = {
          html: getComputedStyle(document.documentElement).backgroundColor,
          body: color("body"),
          header: color(".header"),
          aside: color(".aside_feed"),
          stream: color("#stream"),
          toolbar: color("#cmc_toolbar"),
          card: color("#card"),
          cardHeader: color("#card-header"),
          thumbnail: color("#thumbnail"),
          textCard: color("#text-card"),
          panel: color("#panel"),
          settingsBox: color("#settings-box"),
          settingsInput: color("#settings-input"),
          configureView: control("#configure-view"),
          globalSettings: control("#global-settings"),
          globalSettingsRect: rect("#global-settings"),
          globalSettingsIcon: icon("#global-settings-icon"),
          headerSearch: control("#header-search"),
          headerSearchRect: rect("#header-search"),
          headerSearchInput: control("#header-search-input"),
          headerSearchInputRect: rect("#header-search-input"),
          headerSearchButton: control("#header-search-button"),
          headerSearchButtonRect: rect("#header-search-button"),
          headerSearchIcon: icon("#header-search-icon"),
          mobileSearch: control("#toggle-search"),
          mobileSearchRect: rect("#toggle-search"),
          mobileSearchIcon: icon("#mobile-search-icon"),
          defaultFilter: control("#filter-default"),
          defaultFilterRect: rect("#filter-default"),
          activeFilter: control("#filter-active"),
          markRead: control(".mark-read-menu > .read_all.btn"),
          markReadRect: rect(".mark-read-menu > .read_all.btn"),
          markReadMore: control(".mark-read-menu #nav_menu_read > .dropdown-toggle.btn"),
          markReadMoreBefore: control(".mark-read-menu #nav_menu_read > .dropdown-toggle.btn", "::before"),
          markReadMoreRect: rect(".mark-read-menu #nav_menu_read > .dropdown-toggle.btn"),
          userQueries: control("#toggle-userqueries"),
          sortOrder: control("#toggle-order"),
          userQueriesIcon: icon("#userqueries-icon"),
          markReadIcon: icon(".mark-read-menu #nav_menu_read > .dropdown-toggle.btn img.icon"),
          sortIcon: icon("#sort-icon"),
          readIcon: icon("#read-icon"),
          refreshIcon: icon("#refresh-icon"),
          moreSettings: control("#more-settings"),
          actionGroup: control("#nav_menu_actions"),
          markReadGroup: control(".mark-read-menu"),
          markReadGroupRect: rect(".mark-read-menu"),
          subscriptionCount: control("#subscription-title", "::after"),
          swipeAccent: image("#card", "::before"),
        };
        document.querySelector(".mark-read-menu #nav_menu_read > .dropdown-toggle.btn").click();
        values.viewport = { innerWidth: window.innerWidth, innerHeight: window.innerHeight, clientWidth: document.documentElement.clientWidth };
        values.markReadMenuTarget = !!document.querySelector("#dropdown-read:target");
        values.markReadMenuRect = rect(".mark-read-menu #nav_menu_read > .dropdown-menu");
        const pre = document.createElement("pre");
        pre.id = "computed-results";
        pre.textContent = JSON.stringify(values);
        document.body.append(pre);
      });
    </script>
  </body>
</html>
