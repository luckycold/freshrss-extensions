    <script src="../static/compact-media-cards.js"></script>
    <script>
      (() => {
        const rect = (selector) => {
          const box = document.querySelector(selector).getBoundingClientRect();
          return {
            top: box.top,
            right: box.right,
            bottom: box.bottom,
            left: box.left,
            width: box.width,
            height: box.height,
          };
        };
        const snapshot = () => {
          const stream = document.querySelector("#stream");
          const style = getComputedStyle(stream);
          return {
            masonryActive: stream.classList.contains("cmc-masonry-active"),
            gridAutoFlow: style.gridAutoFlow,
            gridAutoRows: style.gridAutoRows,
            stream: rect("#stream"),
            toolbar: rect("#yl_category_toolbar"),
            footer: rect("#stream-footer"),
            footerMarginBottom: Number.parseFloat(
              getComputedStyle(document.querySelector("#stream-footer")).marginBottom,
            ),
            cards: [...document.querySelectorAll("#stream > .flux")].map((card) => ({
              id: card.id,
              rect: rect(`#${card.id}`),
              titleRect: rect(`#${card.id} a.title`),
              gridRowEnd: getComputedStyle(card).gridRowEnd,
            })),
          };
        };
        addEventListener("load", () => {
          const captureWhenReady = (attempt = 0) => {
            const stream = document.querySelector("#stream");
            if (!stream.classList.contains("cmc-masonry-active") && attempt < 30) {
              setTimeout(() => captureWhenReady(attempt + 1), 50);
              return;
            }
            const initial = snapshot();
            if (new URLSearchParams(location.search).has("static")) {
              const output = document.createElement("pre");
              output.id = "masonry-results";
              output.textContent = JSON.stringify({ initial });
              document.body.append(output);
              return;
            }
            document.querySelector("#card-4").classList.add("active");
            setTimeout(() => {
              const expanded = snapshot();
              document.querySelector("#card-4").classList.remove("active");
              setTimeout(() => {
                const collapsedAgain = snapshot();
                const growingThumbnail = document.querySelector("#card-5 .item.thumbnail");
                growingThumbnail.style.setProperty("--cmc-media-aspect-ratio", "1 / 2");
                window.dispatchEvent(new Event("resize"));
                setTimeout(() => {
                  const afterGrowth = snapshot();
                  document.querySelector("#card-6").remove();
                  setTimeout(() => {
                    const afterRemoval = snapshot();
                    const output = document.createElement("pre");
                    output.id = "masonry-results";
                    output.textContent = JSON.stringify({
                      initial,
                      expanded,
                      collapsedAgain,
                      afterGrowth,
                      afterRemoval,
                    });
                    document.body.append(output);
                  }, 160);
                }, 240);
              }, 120);
            }, 120);
          };
          setTimeout(captureWhenReady, 100);
        });
      })();
    </script>
